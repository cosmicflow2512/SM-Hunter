services:
  vpn:
    image: qmcgaw/gluetun:v3
    container_name: sms-hunter-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /mnt/cache/appdata/sms-hunter/gluetun:/gluetun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTON_WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: Turkey
      TZ: Europe/Berlin
      UPDATER_PERIOD: 480h
    restart: unless-stopped

  hunter:
    build: .
    image: sms-hunter:local
    container_name: sms-hunter
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_SERVICE: ${SMS_SERVICE:-wx}
      SMS_COUNTRY: ${SMS_COUNTRY:-62}
      MAX_PRICE: ${MAX_PRICE:-5}
      PRIORITY_PROVIDERS: ${PRIORITY_PROVIDERS:-406,393,405,311}
      EXCLUDED_PROVIDERS: ${EXCLUDED_PROVIDERS:-396,415,418,12,162,25,405}
      BURST: ${BURST:-4}
      CYCLE_PAUSE: ${CYCLE_PAUSE:-8}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      HOLD_SECONDS: ${HOLD_SECONDS:-900}
      MAX_RESERVATIONS: ${MAX_RESERVATIONS:-1}
      EXPECTED_EGRESS_COUNTRY: TR
      PUSHOVER_APP_TOKEN: ${PUSHOVER_APP_TOKEN}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY}
      PUSHOVER_DEVICE: ${PUSHOVER_DEVICE:-}
      PUSHOVER_PRIORITY: ${PUSHOVER_PRIORITY:-1}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging:
      options:
        max-size: 10m
        max-file: "3"
